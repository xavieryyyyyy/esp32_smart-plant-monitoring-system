<svg xmlns="http://www.w3.org/2000/svg" width="920" height="950" viewBox="0 0 920 950"><rect width="920" height="950" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="#667f74"/></marker></defs><rect x="34" y="18" width="852" height="84" rx="8" fill="#f1f5f4" stroke="#8ca498"/><text x="58" y="48" font-family="Arial" font-size="20" font-weight="bold" fill="#18302d">Acquire and timestamp</text><text x="58" y="77" font-family="Arial" font-size="17" fill="#42545b">Sensor task reads ADC and DHT; queue copies the sample.</text><path d="M460 102V124" stroke="#667f74" stroke-width="2" marker-end="url(#a)"/><rect x="34" y="130" width="852" height="84" rx="8" fill="#f1f5f4" stroke="#8ca498"/><text x="58" y="160" font-family="Arial" font-size="20" font-weight="bold" fill="#18302d">Check sequence</text><text x="58" y="189" font-family="Arial" font-size="17" fill="#42545b">A missing sequence resets the confirmation streak.</text><path d="M460 214V236" stroke="#667f74" stroke-width="2" marker-end="url(#a)"/><rect x="34" y="242" width="852" height="84" rx="8" fill="#f1f5f4" stroke="#8ca498"/><text x="58" y="272" font-family="Arial" font-size="20" font-weight="bold" fill="#18302d">Validate monitoring age</text><text x="58" y="301" font-family="Arial" font-size="17" fill="#42545b">Discard future timestamps or age over 10 seconds; reset streak.</text><path d="M460 326V348" stroke="#667f74" stroke-width="2" marker-end="url(#a)"/><rect x="34" y="354" width="852" height="84" rx="8" fill="#f1f5f4" stroke="#8ca498"/><text x="58" y="384" font-family="Arial" font-size="20" font-weight="bold" fill="#18302d">Check ADC result</text><text x="58" y="413" font-family="Arial" font-size="17" fill="#42545b">On error, reset streak and log; do not classify the failed ADC value.</text><path d="M460 438V460" stroke="#667f74" stroke-width="2" marker-end="url(#a)"/><rect x="34" y="466" width="852" height="84" rx="8" fill="#f1f5f4" stroke="#8ca498"/><text x="58" y="496" font-family="Arial" font-size="20" font-weight="bold" fill="#18302d">Convert and classify</text><text x="58" y="525" font-family="Arial" font-size="17" fill="#42545b">Map raw ADC to simulated percent, then DRY / NORMAL / WET.</text><path d="M460 550V572" stroke="#667f74" stroke-width="2" marker-end="url(#a)"/><rect x="34" y="578" width="852" height="84" rx="8" fill="#f1f5f4" stroke="#8ca498"/><text x="58" y="608" font-family="Arial" font-size="20" font-weight="bold" fill="#18302d">Confirm a changed state</text><text x="58" y="637" font-family="Arial" font-size="17" fill="#42545b">Require three consecutive matches; held states do not repeat.</text><path d="M460 662V684" stroke="#667f74" stroke-width="2" marker-end="url(#a)"/><rect x="34" y="690" width="852" height="84" rx="8" fill="#f1f5f4" stroke="#8ca498"/><text x="58" y="720" font-family="Arial" font-size="20" font-weight="bold" fill="#18302d">Evaluate cooldown and enqueue</text><text x="58" y="749" font-family="Arial" font-size="17" fill="#42545b">Suppress ineligible repeated alerts; record cooldown only if queued.</text><path d="M460 774V796" stroke="#667f74" stroke-width="2" marker-end="url(#a)"/><rect x="34" y="802" width="852" height="84" rx="8" fill="#f1f5f4" stroke="#8ca498"/><text x="58" y="832" font-family="Arial" font-size="20" font-weight="bold" fill="#18302d">Format and dispatch</text><text x="58" y="861" font-family="Arial" font-size="17" fill="#42545b">Use captured values; attempt Slack, Discord, Telegram, then Gmail.</text><text x="34" y="938" font-family="Arial" font-size="15" fill="#596873">Invalid DHT results remain independent; failed environmental values are labeled unavailable.</text></svg>