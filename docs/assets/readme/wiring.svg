<svg xmlns="http://www.w3.org/2000/svg" width="960" height="584" viewBox="0 0 960 584" role="img" aria-labelledby="title desc">
<title id="title">ESP32-S3 electrical wiring</title><desc id="desc">Potentiometer outer terminals connect to 3V3 and common ground. Wiper connects to GPIO1 ADC1 channel 0. DHT11 VCC connects to 3V3, S to GPIO2, minus to common ground. Repeated supply labels represent the same electrical nets, not additional physical pins.</desc>
<defs><linearGradient id="surface" x2="1" y2="1"><stop stop-color="#18232a"/><stop offset="1" stop-color="#10171e"/></linearGradient></defs>
<rect x="1" y="1" width="958" height="582" rx="14" fill="#0d1117" stroke="#34443e"/>
<g font-family="Inter,Arial,sans-serif" fill="#e6edf3"><text x="38" y="48" font-size="23" font-weight="600">Electrical connections</text><text x="38" y="74" fill="#9caab6" font-size="14">Terminal labels identify nets, not the physical orientation of module headers.</text>
<rect x="38" y="100" width="280" height="400" rx="10" fill="url(#surface)" stroke="#43544c"/><text x="64" y="138" font-size="22">ESP32-S3 N16R8</text>
<rect x="594" y="100" width="326" height="180" rx="10" fill="url(#surface)" stroke="#43544c"/><text x="620" y="138" font-size="20">Potentiometer</text>
<rect x="594" y="320" width="326" height="180" rx="10" fill="url(#surface)" stroke="#43544c"/><text x="620" y="358" font-size="20">DHT11 HW-481 V0.2</text>
<g font-size="16"><text x="64" y="177">3V3</text><text x="64" y="219">GPIO1 / ADC1 CH0</text><text x="64" y="261">GND</text><text x="64" y="397">3V3</text><text x="64" y="439">GPIO2</text><text x="64" y="481">GND</text><text x="620" y="177">Outer terminal A</text><text x="620" y="219">Center / wiper</text><text x="620" y="261">Outer terminal B</text><text x="620" y="397">VCC</text><text x="620" y="439">S / data</text><text x="620" y="481">Minus / ground</text></g>
<g fill="none" stroke-width="2.4"><path d="M318 172H594M318 392H594" stroke="#dfaa87"/><path d="M318 214H594" stroke="#b2caa8"/><path d="M318 434H594" stroke="#9fbcd6"/><path d="M318 256H594M318 476H594" stroke="#85929e"/></g>
<g fill="#d7e6de"><circle cx="318" cy="172" r="3"/><circle cx="594" cy="172" r="3"/><circle cx="318" cy="214" r="3"/><circle cx="594" cy="214" r="3"/><circle cx="318" cy="256" r="3"/><circle cx="594" cy="256" r="3"/><circle cx="318" cy="392" r="3"/><circle cx="594" cy="392" r="3"/><circle cx="318" cy="434" r="3"/><circle cx="594" cy="434" r="3"/><circle cx="318" cy="476" r="3"/><circle cx="594" cy="476" r="3"/></g>
<text x="38" y="537" font-size="14" fill="#a2b0bb">All 3V3 labels share one supply; all GND labels share one ground.</text><text x="38" y="559" font-size="13" fill="#82939e">Disconnect power before wiring. Keep the potentiometer input within the board's 3.3 V supply.</text>
</g></svg>
