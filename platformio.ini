; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Build and upload settings for this ESP32-S3 project.
; Name the build/upload environment; PlatformIO uses this identifier in commands and .pio/build.
[env:esp32-s3-devkitc-1]
; Use PlatformIO's Espressif32 platform to resolve ESP-IDF tooling for this board.
platform = espressif32
; Use the ESP32-S3 DevKitC profile; the explicit flash settings below adapt it to this N16R8 board.
board = esp32-s3-devkitc-1
; Build C firmware with ESP-IDF, matching the project's framework requirement.
framework = espidf
; Read serial output at 115200 bits per second, matching the firmware console.
monitor_speed = 115200

; Match the 16 MB flash on our N16R8 board.
; Tell the uploader about the board's 16 MB physical flash; application-space size comes from
; partitions.csv.
board_upload.flash_size = 16MB

; Use our flash layout, which includes a 4 MB application space.
; Choose our custom flash partition map instead of the profile's smaller default application
; partition.
board_build.partitions = partitions.csv
; Run the computer-side refresh helper before the build.
; Run the existing pre-build helper so component-list/dependency changes trigger CMake
; reconfiguration.
extra_scripts = pre:scripts/refresh_component_cmake.py

; Use Unity for the on-device monitoring tests invoked with pio test.
test_framework = unity
; Tests have their own app_main, so leave the normal src application out.
; Exclude the production src entry point from the test binary because the test supplies its own
; app_main().
test_build_src = no